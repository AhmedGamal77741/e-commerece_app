workflows:
  ios-release:
    name: Flutter iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    integrations:
      app_store_connect: AppStoreKey
      
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      vars:
        APP_ID: "com.pang2chocolate.app"
        
    scripts:
      - name: Install dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install
          
      - name: Force Bundle ID and set up code signing
        script: |
          # 1. This FORCES your Xcode project to use the correct Bundle ID, just in case it was wrong
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = ${APP_ID};/g" ios/Runner.xcodeproj/project.pbxproj
          
          keychain initialize
          app-store-connect fetch-signing-files "${APP_ID}" --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files "${APP_ID}" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # 2. We explicitly tell Codemagic to target Runner.xcodeproj so it doesn't get confused by Pods
          xcode-project use-profiles --project ios/Runner.xcodeproj
          
      - name: Build Flutter framework
        script: |
          flutter build ios --release --no-codesign
          
      - name: Package and Sign IPA
        script: |
          xcode-project build-ipa --workspace "ios/Runner.xcworkspace" --scheme "Runner"
          
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
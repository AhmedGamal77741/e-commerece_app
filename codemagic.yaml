workflows:
  ios-release:
    name: Flutter iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    integrations:
      app_store_connect: AppStoreKey
      
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
        
    scripts:
      - name: Install dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install
          
      - name: Fetch Certificates and Profiles
        script: |
          keychain initialize
          
          # 1. Fetch/Create both required profiles dynamically
          app-store-connect fetch-signing-files "com.pang2chocolate.app" --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files "com.pang2chocolate.app" --type IOS_APP_STORE --create
          
          keychain add-certificates
          
          # 2. Apply profiles to Xcode AND generate the magic export_options.plist
          xcode-project use-profiles --project ios/Runner.xcodeproj
          
      - name: Build IPA
        script: |
          # 3. Build the app using Flutter's native command, passing it the generated plist!
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
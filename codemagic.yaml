workflows:
  ios-release:
    name: Flutter iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    integrations:
      app_store_connect: AppStoreKey
      
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      vars:
        APP_ID: "com.pang2chocolate.app"
        
    scripts:
      - name: Install dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install
          
      - name: Fetch and Create Profiles dynamically
        script: |
          keychain initialize
          
          # This forces Apple to generate the certificates and profiles on the spot!
          app-store-connect fetch-signing-files "${APP_ID}" --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files "${APP_ID}" --type IOS_APP_STORE --create
          
          keychain add-certificates
          
          # This injects them into your now-fixed Xcode project and generates the plist
          xcode-project use-profiles
          
      - name: Build IPA
        script: |
          # Flutter uses the generated plist to build flawlessly
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
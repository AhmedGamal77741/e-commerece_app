workflows:
  ios-release:
    name: Flutter iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    integrations:
      app_store_connect: AppStoreKey
      
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      vars:
        APP_ID: "com.pang2chocolate.app"
        
    scripts:
      - name: Install dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install
          
      - name: Set up code signing settings on Xcode project
        script: |
          keychain initialize
          # This command will now actually run and create the profile
          app-store-connect fetch-signing-files "com.pang2chocolate.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Build IPA
        script: |
          flutter build ipa --release
          
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
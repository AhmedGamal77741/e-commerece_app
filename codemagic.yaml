workflows:
  ios-release:
    name: Flutter iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    # Links your uploaded API key to this workflow
    integrations:
      app_store_connect: AppStoreKey
      
    # We bring this back! Codemagic will now find the profiles because our last script created them.
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pang2chocolate.app
      vars:
        APP_ID: "com.pang2chocolate.app"
        
    scripts:
      - name: Install dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install
          
      - name: Build IPA
        script: |
          # The magic happens here: we feed Codemagic's auto-generated plist into Flutter
          flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS
          
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
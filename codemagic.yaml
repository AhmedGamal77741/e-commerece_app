workflows:
  ios-fastlane-release:
    name: Flutter iOS Fastlane TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    integrations:
      app_store_connect: AppStoreKey
      
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pang2chocolate.app
      vars:
        APP_ID: "com.pang2chocolate.app"
        
    scripts:
      - name: Install dependencies & Ruby gems
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios
          bundle install
          pod install

      - name: Build & Deploy with Fastlane
        script: |
          cd ios
          bundle exec fastlane beta
          
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log

  ios-native-release:
    name: Flutter iOS Native Codemagic TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    integrations:
      app_store_connect: AppStoreKey
      
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      groups:
        - AppStore_Distribution_Cert
      vars:
        APP_ID: "com.pang2chocolate.app"
        
    scripts:
      - name: Install dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install
          
      - name: Fetch and Create App Store Profile
        script: |
          keychain initialize
          keychain add-certificates
          app-store-connect fetch-signing-files "${APP_ID}" --type IOS_APP_STORE --ignore-missing-certs
          xcode-project use-profiles
          
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
    artifacts:
      - build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
workflows:
  ios-release:
    name: Flutter iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    integrations:
      app_store_connect: AppStoreKey
      
    # 1. Notice ios_signing is GONE again!
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      vars:
        APP_ID: "com.pang2chocolate.app"
        
    scripts:
      - name: Install dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install
          
      - name: Set up code signing settings on Xcode project
        script: |
          # 2. We use the CLI to fetch/create the profiles
          keychain initialize
          app-store-connect fetch-signing-files "com.pang2chocolate.app" --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files "com.pang2chocolate.app" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # This disables Automatic Code Signing in Xcode
          xcode-project use-profiles
          
      - name: Build Flutter framework
        script: |
          # 3. We build the Flutter code WITHOUT trying to sign it
          flutter build ios --release --no-codesign
          
      - name: Package and Sign IPA
        script: |
          # 4. We use Codemagic's native Xcode tool to package the IPA and sign it with our fetched profiles
          xcode-project build-ipa --workspace "ios/Runner.xcworkspace" --scheme "Runner"
          
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
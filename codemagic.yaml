workflows:
  ios-release:
    name: Flutter iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      vars:
        APP_ID: "com.pang2chocolate.app"
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && bundle install && pod install
      - name: Build & Deploy via Fastlane
        script: |
          cd ios
          bundle exec fastlane beta
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log

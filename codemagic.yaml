workflows:
  ios-release:
    name: Flutter iOS TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    
    integrations:
      app_store_connect: AppStoreKey
      
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ruby: default
      vars:
        APP_ID: "com.pang2chocolate.app"
        
    scripts:
      - name: Install dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install
          
      - name: Fetch and Create App Store Profile ONLY
        script: |
          keychain initialize
          
          # 1. We ONLY fetch the App Store profile. We deleted the Development line!
          app-store-connect fetch-signing-files "${APP_ID}" --type IOS_APP_STORE --create
          
          keychain add-certificates
          
          # 2. This forces Xcode to use the App Store profile for every phase of the build
          xcode-project use-profiles
          
      - name: Build IPA
        script: |
          # 3. Flutter will now strictly use Distribution signing and output the IPA
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
    artifacts:
      - build/ios/ipa/*.ipa
      - ~/.fastlane/logs/**/*.log
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true